<!doctype html>
<html lang="te" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Divya</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="description" content="Divya — your personal AI: video editing, voice assistant, chat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Divya">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a href="#screen-title" class="skip" data-t="skip"></a>
<div id="app">

  <!-- LOGIN -->
  <section id="login" class="login" hidden aria-labelledby="loginTitle">
    <div class="login-card">
      <img src="icon-192.png" class="login-logo" alt="">
      <h1 id="loginTitle" tabindex="-1">Divya</h1>
      <p class="muted" id="loginSub" data-t="loginSub2"></p>
      <div class="net-banner" id="netBanner" role="alert" hidden><b data-t="netBlockedT"></b><span class="nb-text"></span><button type="button" class="btn secondary" data-t="retry" data-retry></button></div>
      <button class="btn primary" id="loginGoogleBtn" type="button"><span data-t="googleRow"></span></button>
      <p class="muted small center" data-t="orLoginPw"></p>
      <div class="seg auth-tabs" id="authTabs" role="tablist" data-tl="loginWays">
        <button type="button" role="tab" id="tab-pw" data-v="pw" aria-controls="pwForm" data-t="tabLogin"></button>
        <button type="button" role="tab" id="tab-su" data-v="su" aria-controls="suForm" data-t="tabSignup"></button>
        <button type="button" role="tab" id="tab-wa" data-v="wa" aria-controls="numForm" data-t="tabWa"></button>
      </div>
      <form id="pwForm" class="stack auth-form" role="tabpanel" aria-labelledby="tab-pw" novalidate>
        <label class="field tf"><span class="sr-only" data-t="idLabel"></span><input id="pwId" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" data-tp="idPh" required></label>
        <label class="field tf"><span class="sr-only" data-t="pwLabel"></span><input id="pwPass" type="password" autocomplete="current-password" data-tp="pwLabel" required><button type="button" class="eye" data-tl="showPw" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <button class="btn primary" id="pwBtn" data-t="logIn"></button>
        <button type="button" class="btn ghost" id="forgotBtn" data-t="forgot"></button>
      </form>
      <form id="suForm" class="stack auth-form" role="tabpanel" aria-labelledby="tab-su" hidden novalidate>
        <label class="field tf"><span class="sr-only" data-t="nameLabel"></span><input id="suName" type="text" autocomplete="name" maxlength="60" data-tp="nameLabel" required></label>
        <label class="field tf"><span class="sr-only" data-t="emailLabel"></span><input id="suEmail" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" data-tp="emailLabel" required></label>
        <label class="field tf"><span class="prefix" aria-hidden="true">+91</span><span class="sr-only" data-t="phoneLabel"></span><input id="suPhone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="16" data-tp="phoneLabel"></label>
        <label class="field tf"><span class="sr-only" data-t="newPwLabel"></span><input id="suPass" type="password" autocomplete="new-password" minlength="8" data-tp="newPwLabel" required><button type="button" class="eye" data-tl="showPw" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <p class="muted small left" data-t="suHint"></p>
        <button class="btn primary" id="suBtn" data-t="createAcct"></button>
        <button type="button" class="btn ghost" id="suVoiceBtn">🎙️ <span data-t="voiceSignup"></span></button>
      </form>
      <form id="numForm" class="stack auth-form" role="tabpanel" aria-labelledby="tab-wa" hidden>
        <p class="muted small" data-t="loginSub"></p>
        <label class="field" for="num">
          <span class="prefix" aria-hidden="true">+91</span>
          <span class="sr-only" data-t="numLabel"></span>
          <input id="num" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98765 43210" required>
        </label>
        <button class="btn primary" id="numBtn" data-t="getCode"></button>
      </form>
      <form id="codeForm" class="stack auth-form" hidden>
        <p class="muted small" id="codeSent" aria-live="polite"></p>
        <label for="code" class="sr-only" data-t="codeLabel"></label>
        <input id="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
        <button class="btn primary" id="codeBtn" data-t="verify"></button>
        <p class="muted small" data-t="codeHint"></p>
        <button type="button" class="btn ghost" id="changeNum" data-t="changeNum"></button>
      </form>
      <form id="fgForm" class="stack auth-form" hidden novalidate>
        <h2 class="h3" data-t="forgotT"></h2>
        <p class="muted small" data-t="forgotSub"></p>
        <label class="field tf"><span class="sr-only" data-t="idLabel"></span><input id="fgId" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" data-tp="idPh" required></label>
        <button class="btn primary" id="fgBtn" data-t="sendResetCode"></button>
        <button type="button" class="btn ghost" data-back data-t="backLogin"></button>
      </form>
      <form id="rsForm" class="stack auth-form" hidden novalidate>
        <p class="muted small" id="rsSent" aria-live="polite"></p>
        <label for="rsCode" class="sr-only" data-t="codeLabel"></label>
        <input id="rsCode" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
        <label class="field tf"><span class="sr-only" data-t="newPwLabel"></span><input id="rsPass" type="password" autocomplete="new-password" minlength="8" data-tp="newPwLabel" required><button type="button" class="eye" data-tl="showPw" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <button class="btn primary" id="rsBtn" data-t="setPw"></button>
        <button type="button" class="btn ghost" data-back data-t="backLogin"></button>
      </form>
      <form id="pvForm" class="stack auth-form" hidden novalidate>
        <h2 class="h3" data-t="verifyPhoneT"></h2>
        <p class="muted small" id="pvSent" aria-live="polite"></p>
        <label for="pvCode" class="sr-only" data-t="codeLabel"></label>
        <input id="pvCode" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
        <button class="btn primary" id="pvBtn" data-t="verify"></button>
        <button type="button" class="btn ghost" id="pvSkip" data-t="later"></button>
      </form>
      <p class="err" id="loginErr" role="alert"></p>
    </div>
  </section>

  <!-- MAIN -->
  <div id="main" hidden>
    <div class="net-banner in-app" id="netBanner2" role="alert" hidden><b data-t="netBlockedT"></b><span class="nb-text"></span><button type="button" class="btn secondary" data-t="retry" data-retry></button></div>
    <header class="appbar">
      <button class="icon-btn" id="menuBtn" aria-controls="drawer" aria-expanded="false" data-tl="openMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="screen-title" tabindex="-1"></h1>
      <button class="avatar-btn" id="avatarBtn" data-tl="openProfile"><span class="avatar" id="avatarTop" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></button>
    </header>

    <div class="drawer-bg" id="drawerBg" hidden></div>
    <nav id="drawer" class="drawer" data-tl="menu" inert>
      <div class="drawer-head"><img src="icon-192.png" alt=""><div><b>Divya</b><div class="muted small" id="drawerMe"></div></div></div>
      <ul>
        <li><a href="#/home" data-r="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="sHome"></span></a></li>
        <li><a href="#/chat" data-r="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span data-t="sChat"></span></a></li>
        <li><a href="#/history" data-r="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/></svg><span data-t="sHistory"></span></a></li>
        <li><a href="#/voice" data-r="voice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span data-t="sVoice"></span></a></li>
        <li><a href="#/connect" data-r="connect"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-t="sConnect"></span></a></li>
        <li><a href="#/plan" data-r="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span data-t="sPlan"></span></a></li>
        <li><a href="#/download" data-r="download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-t="sDownload"></span></a></li>
        <li><a href="#/profile" data-r="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-t="sProfile"></span></a></li>
        <li><a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span data-t="sSettings"></span></a></li>
        <!-- v37: Setup goes LAST (before logout) — it is a one-time screen, not a daily destination. -->
        <li><a href="#/setup" data-r="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span data-t="sSetup"></span></a></li>
        <li><button id="drawerLogout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></svg><span data-t="logout"></span></button></li>
      </ul>
    </nav>

    <main id="screens">
      <!-- HOME -->
      <section id="s-home" class="screen" data-title="sHome">
        <div class="scroll pad">
          <p class="greet"><span id="greet"></span><br><span class="muted" data-t="greetSub"></span></p>
          <button class="hey" id="heyBtn">
            <span class="hey-orb" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></span>
            <span class="hey-txt"><b>Hey Divya</b><span class="muted small" data-t="heySub"></span></span>
          </button>
          <a class="card quota" id="homeQuota" href="#/chat"><span class="q-num" id="homeQuotaNum">–</span><span class="q-txt"><b data-t="editsLeftT"></b><span class="muted small" id="homeQuotaSub"></span></span><span class="q-go" aria-hidden="true">›</span></a>
          <ul class="grid" data-tl="quickActions">
            <li><a href="#/chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span data-t="gChat"></span></a></li>
            <li><a href="#/history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/></svg><span data-t="gHistory"></span></a></li>
            <li><a href="#/voice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 10v4M22 12h0"/></svg><span data-t="gVoice"></span></a></li>
            <li><a href="#/connect"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-t="gConnect"></span></a></li>
            <li><a href="#/plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span data-t="gPlan"></span></a></li>
            <li><a href="#/download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-t="gDownload"></span></a></li>
            <li><a href="#/settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span data-t="gSettings"></span></a></li>
            <!-- v37: Setup goes LAST in the quick-action grid. -->
            <li><a href="#/setup"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span data-t="gSetup"></span></a></li>
          </ul>
          <div class="card job" id="homeJob" aria-live="polite">
            <div class="job-row"><span class="pulse idle" id="homeJobDot" aria-hidden="true"></span><div><b id="homeJobTitle" data-t="noJob"></b><div class="muted small" id="homeJobSub" data-t="noJobSub"></div></div></div>
          </div>
        </div>
      </section>

      <!-- CHAT -->
      <section id="s-chat" class="screen" data-title="sChat">
        <div id="msgs" class="msgs" role="log" aria-live="polite"></div>
        <div class="composer-wrap">
          <div id="attachChip" class="attach-chip" hidden><span id="attachChipTxt"></span><button type="button" id="attachChipX" aria-label="Remove">×</button></div>
          <div id="recBar" class="rec-bar" hidden><span class="dot" aria-hidden="true"></span><span id="recTime">0:00</span><span class="muted small" data-t="releaseToSend"></span></div>
          <form id="composer" class="composer">
            <button type="button" class="icon-btn" id="attach" data-tl="attachImage">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/><path d="M19 17v6M16 20h6"/></svg>
            </button>
            <input type="file" id="file" accept="image/*,video/*" hidden>
            <label for="input" class="sr-only" data-t="typeMsg"></label>
            <textarea id="input" rows="1" data-tp="typeMsg"></textarea>
            <button type="button" class="send-btn mic" id="micSend" data-tl="holdToTalk">
              <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
              <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
            </button>
            <!-- R32: separate always-visible send button next to the mic — the send
                 affordance must never depend on a class that may never flip. -->
            <button type="button" class="send-btn send" id="chatSend" aria-label="Send">
              <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
            </button>
          </form>
        </div>
      </section>

      <!-- HISTORY (R22: video 1, 2, 3... — upload happens in chat, no Post page) -->
      <section id="s-history" class="screen" data-title="sHistory">
        <div class="scroll pad">
          <p class="muted small" data-t="histIntro"></p>
          <div id="histList" class="stack" aria-live="polite"></div>
          <p class="muted" id="histEmpty" data-t="histEmpty" hidden></p>
        </div>
      </section>

      <!-- VOICE -->
      <section id="s-voice" class="screen" data-title="sVoice">
        <div class="scroll pad voice">
          <button class="orb-btn" id="orbBtn" data-tl="tapToTalk">
            <span class="orb" id="orb" data-state="idle" aria-hidden="true"><i></i><i></i><i></i><b></b></span>
          </button>
          <p class="v-state" id="vState" aria-live="assertive"></p>
          <span id="wakeDot" class="wake-dot" hidden aria-hidden="true"></span>
          <p class="v-heard" id="vHeard" aria-live="polite"></p>
          <p class="v-reply" id="vReply" aria-live="polite"></p>
          <div class="v-actions" id="vActions"></div>
          <div class="list">
            <div class="row"><label for="wakeToggle"><span>Hey Divya · <span lang="te">హే దివ్య</span></span><br><span class="muted small" data-t="wakeSub"></span></label>
              <span class="switch"><input type="checkbox" id="wakeToggle" role="switch"><span aria-hidden="true"></span></span></div>
            <a class="row link" href="#/settings"><span data-t="voicePick"></span><span class="muted r"><span class="voiceName"></span> ›</span></a>
          </div>
          <div class="card note small">
            <p><b data-t="freeTitle"></b> <span data-t="freeList"></span></p>
            <p><b data-t="proTitle"></b> <span data-t="proList"></span></p>
            <p class="muted" data-t="voiceHonest"></p>
          </div>
        </div>
      </section>

      <!-- CONNECT -->
      <section id="s-connect" class="screen" data-title="sConnect">
        <div class="scroll pad"><div id="provList" class="list"></div><p class="muted small center" data-t="connectNote"></p></div>
      </section>

      <!-- SETUP -->
      <section id="s-setup" class="screen" data-title="sSetup">
        <div class="scroll pad">
          <!-- v39 (D4): live setup-run state. The page used to show only the
               6 key rows, so a run that died hours ago still looked like it
               was "running" in chat. Filled by loadSetupState(). -->
          <div class="card note" id="setupStateCard" hidden>
            <p><b id="setupStateTitle"></b></p>
            <p class="muted small" id="setupStateSub"></p>
            <button class="btn secondary" id="setupRetryBtn" data-t="setupRetry" hidden></button>
          </div>
          <p class="muted" data-t="setupIntro"></p>
          <!-- R48: plain-words explainer — Divya does everything with one allow
               (accounts, API keys, captchas, server). The user is asked for
               ONE thing only, and only once: the email-link tap / SMS code. -->
          <div class="card note small" id="setupHow">
            <p><b data-t="setupHowT"></b></p>
            <p><b data-t="setupHowDivyaT"></b> <span data-t="setupHowDivya"></span></p>
            <p><b data-t="setupHowYouT"></b></p>
            <p><span data-t="setupYouEmail"></span></p>
            <p><span data-t="setupYouSms"></span></p>
            <p><b data-t="setupHowAfterT"></b> <span data-t="setupHowAfter"></span></p>
            <p class="muted" data-t="setupHowNote"></p>
          </div>
          <button class="btn primary" id="oneTapBtn" data-t="setupOneTap" disabled></button>
          <p class="muted small" data-t="setupConsent"></p>
          <div class="list">
            <div class="row"><div><b data-t="googleRow"></b><div class="muted small" id="gWho" data-t="googleSub"></div></div><button class="pill go" id="gBtn" data-t="continueGoogle"></button></div>
          </div>
          <label class="consent"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
          <button class="btn secondary" id="guideBtn" data-t="guideBtn"></button>
          <ol class="steps" id="steps"></ol>
          <div class="card note small" id="autoLogCard" hidden>
            <p><b data-t="autoLogT"></b></p>
            <ul id="autoLog"></ul>
          </div>
          <p class="muted small" data-t="setupStepNote"></p>
          <div class="card note small">
            <p><b data-t="serverTitle"></b> <span data-t="serverText"></span></p>
          </div>
        </div>
      </section>

      <!-- PLAN -->
      <section id="s-plan" class="screen" data-title="sPlan">
        <div class="scroll pad">
          <p class="muted" id="planNow"></p>
          <div class="card plan">
            <h2 data-t="freePlan"></h2>
            <ul class="ticks"><li data-t="f0"></li><li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li><li data-t="f4"></li></ul>
          </div>
          <div class="card" id="planList"></div>
          <div class="card" id="refCard">
            <h2 data-t="inviteTitle"></h2>
            <p class="muted small" data-t="inviteSub"></p>
            <p><b id="refCode"></b> <button class="btn" id="refCopy" data-t="copy"></button></p>
            <div class="bubble-input"><input id="refInput" type="text" maxlength="6" placeholder="DV0000" aria-label="Referral code"><button id="refRedeemBtn" class="btn primary" data-t="redeem"></button></div>
            <p class="muted small" id="refStatus"></p>
          </div>
          <p class="muted small center" data-t="noPayNote"></p>
        </div>
      </section>

      <!-- DOWNLOAD -->
      <section id="s-download" class="screen" data-title="sDownload">
        <div class="scroll pad">
          <div class="card stack center">
            <img src="icon-192.png" alt="" class="dl-icon">
            <p id="dlStatus" aria-live="polite"></p>
            <button class="btn primary" id="installBtn" data-t="installNow"></button>
            <p class="muted small" data-t="notApk"></p>
          </div>
          <div class="card"><h2 class="h3">Android · Chrome</h2><ol class="small"><li data-t="and1"></li><li data-t="and2"></li><li data-t="and3"></li></ol></div>
          <div class="card"><h2 class="h3">iPhone / iPad · Safari</h2><ol class="small"><li data-t="ios1"></li><li data-t="ios2"></li><li data-t="ios3"></li></ol></div>
          <div class="card"><h2 class="h3">Windows / Mac · Chrome, Edge</h2><ol class="small"><li data-t="pc1"></li><li data-t="pc2"></li></ol></div>
        </div>
      </section>

      <!-- PROFILE -->
      <section id="s-profile" class="screen" data-title="sProfile">
        <div class="scroll pad">
          <div class="prof-head">
            <span class="avatar big" id="avatarBig" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
            <div><h2 id="profName"></h2><div class="muted small" id="profSub"></div></div>
          </div>
          <div class="list">
            <div class="row"><span data-t="email"></span><span class="muted r" id="profEmail"></span></div>
            <div class="row"><span data-t="phone"></span><span class="muted r" id="profPhone"></span></div>
            <a class="row link" href="#/plan"><span data-t="planL"></span><span class="muted r"><span id="profPlan"></span> ›</span></a>
            <a class="row link" href="#/chat"><span data-t="editsLeftT"></span><span class="muted r"><span id="profEdits"></span> ›</span></a>
            <a class="row link" href="#/connect"><span data-t="connected"></span><span class="muted r"><span id="profConn"></span> ›</span></a>
          </div>
          <div class="card stack acct-card" id="acctCard" hidden>
            <h2 class="h3" data-t="account"></h2>
            <p class="small" id="acctInfo"></p>
            <p class="small" id="phoneInfo" aria-live="polite"></p>
            <form id="lpForm" class="stack" novalidate>
              <label class="field tf"><span class="prefix" aria-hidden="true">+91</span><span class="sr-only" data-t="phoneLabel"></span><input id="lpPhone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="16" data-tp="phoneLabel"></label>
              <button class="btn primary" id="lpBtn" data-t="sendCode"></button>
            </form>
            <form id="lvForm" class="stack" hidden novalidate>
              <label for="lvCode" class="sr-only" data-t="codeLabel"></label>
              <input id="lvCode" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
              <button class="btn primary" id="lvBtn" data-t="verify"></button>
            </form>
            <p class="err" id="acctErr" role="alert"></p>
            <button type="button" class="btn ghost" id="delOpen" data-t="delAcct"></button>
            <form id="delForm" class="stack" hidden novalidate>
              <p class="small" data-t="delWarn"></p>
              <label class="field tf"><span class="sr-only" data-t="pwLabel"></span><input id="delPass" type="password" autocomplete="current-password" data-tp="pwLabel" required></label>
              <button class="btn primary" id="delBtn" data-t="delConfirm"></button>
            </form>
          </div>
          <div class="list"><button class="row link danger" id="profLogout"><span data-t="logout"></span></button></div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="s-settings" class="screen" data-title="sSettings">
        <div class="scroll pad">
          <div class="list">
            <div class="row"><span id="lblSetLang" data-t="language"></span>
              <div class="seg small" id="setLang" role="radiogroup" aria-labelledby="lblSetLang"><button data-v="te">Telugu</button><button data-v="en">English</button><button data-v="hi">हिन्दी</button><button data-v="hi-Latn">Hinglish</button></div></div>
            <div class="row"><label for="setVoice"><span data-t="voiceReplies"></span><br><span class="muted small" data-t="voiceRepliesSub"></span></label>
              <span class="switch"><input type="checkbox" id="setVoice" role="switch"><span aria-hidden="true"></span></span></div>
            <div class="row"><label for="setVF"><span data-t="voiceFirst"></span><br><span class="muted small" data-t="voiceFirstSub"></span></label>
              <span class="switch"><input type="checkbox" id="setVF" role="switch"><span aria-hidden="true"></span></span></div>
            <div class="row"><label for="setBlind"><span data-t="blindMode"></span><br><span class="muted small" data-t="blindModeSub"></span></label>
              <span class="switch"><input type="checkbox" id="setBlind" role="switch"><span aria-hidden="true"></span></span></div>
            <button class="row link" id="voiceRow"><span data-t="voicePick"></span><span class="muted r"><span class="voiceName"></span> ›</span></button>
            <div id="voiceList" class="card stack" hidden></div>
            <button class="row link" id="updRow"><span data-t="updCheck"></span><span class="muted r">›</span></button>
            <div class="row"><span id="lblTheme" data-t="theme"></span>
              <div class="seg small" id="setTheme" role="radiogroup" aria-labelledby="lblTheme"><button data-v="auto" data-t="auto"></button><button data-v="light" data-t="light"></button><button data-v="dark" data-t="dark"></button></div></div>
            <a class="row link" href="#/connect"><span data-t="connected"></span><span class="muted"><span id="connCount"></span> ›</span></a>
            <button class="row link danger" id="logout"><span data-t="logout"></span></button>
            <button class="row link danger" id="delDataBtn"><span data-t="delData"></span></button>
          </div>
          <p class="muted small center" id="me"></p>
        </div>
      </section>
    </main>
    <nav class="tabbar" id="tabbar" data-tl="tabsLabel">
      <a href="#/home" data-r="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tHome"></span></a>
      <a href="#/voice" data-r="voice" class="tab-voice"><span class="tv-orb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></span><span data-t="tVoice"></span></a>
      <a href="#/chat" data-r="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span data-t="tChat"></span></a>
      <a href="#/plan" data-r="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span data-t="tPlan"></span></a>
      <a href="#/setup" data-r="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span data-t="tSetup"></span></a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- App update banner: shown when a newer sw.js version is detected, so a phone
       can never stay stuck on a stale cached shell (black screen / missing templates). -->
  <div id="updBanner" class="upd-banner" role="alert" hidden><span id="updText"></span><button type="button" class="btn primary" id="updRefreshBtn" data-t="updRefresh"></button></div>
  <div id="bubble" class="bubble" hidden>
    <div id="bubblePanel" class="bubble-panel" hidden>
      <div class="bubble-head"><b>Divya</b><button id="bubbleClose" aria-label="Close">✕</button></div>
      <div id="bubbleLog" class="bubble-log" aria-live="polite"></div>
      <div class="bubble-input"><input id="bubbleText" type="text" data-tp="bubblePh" aria-label="Message Divya"><button id="bubbleSend" class="btn primary">➤</button></div>
    </div>
    <button id="bubbleBtn" class="bubble-btn" aria-label="Divya chat">💬</button>
  </div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
  <div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetText"><p id="sheetText"></p><div class="sheet-btns" id="sheetBtns"></div></div></div>
</div>
<script src="voices-kokoro.js"></script>
<script src="app.js"></script>
</body>
</html>
