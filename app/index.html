<!doctype html>
<html lang="te" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Divya</title>
<meta name="theme-color" content="#0c0c12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)">
<meta name="description" content="Divya — your personal AI">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Divya">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <section id="login" class="screen login" hidden>
    <div class="login-card">
      <img src="/icon-192.png" class="login-logo" alt="">
      <h1>Divya</h1>
      <p class="muted" data-t="loginSub"></p>
      <form id="numForm" class="stack">
        <label class="field">
          <span class="prefix">+91</span>
          <input id="num" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98765 43210" required>
        </label>
        <button class="btn primary" id="numBtn" data-t="getCode"></button>
      </form>
      <form id="codeForm" class="stack" hidden>
        <p class="muted small" id="codeSent"></p>
        <input id="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
        <button class="btn primary" id="codeBtn" data-t="verify"></button>
        <p class="muted small" data-t="codeHint"></p>
        <button type="button" class="btn ghost small" id="changeNum" data-t="changeNum"></button>
      </form>
      <p class="err" id="loginErr" role="alert"></p>
    </div>
  </section>

  <!-- MAIN -->
  <main id="main" hidden>
    <!-- CHAT -->
    <section id="tab-chat" class="screen tab active">
      <header class="top">
        <div class="avatar"><img src="/icon-192.png" alt=""></div>
        <div class="who"><b>Divya</b><span id="status" class="muted small" data-t="online"></span></div>
      </header>
      <div id="msgs" class="msgs" aria-live="polite"></div>
      <div class="composer-wrap">
        <div id="recBar" class="rec-bar" hidden><span class="dot"></span><span id="recTime">0:00</span><span class="muted small" data-t="releaseToSend"></span></div>
        <form id="composer" class="composer">
          <button type="button" class="icon-btn" id="attach" aria-label="Image">
            <svg viewBox="0 0 24 24"><path d="M21 15V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/><path d="M19 17v6M16 20h6"/></svg>
          </button>
          <input type="file" id="file" accept="image/*" hidden>
          <textarea id="input" rows="1" data-tp="typeMsg"></textarea>
          <button type="button" class="send-btn mic" id="micSend" aria-label="Mic">
            <svg class="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
            <svg class="i-send" viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </section>

    <!-- CREATE -->
    <section id="tab-create" class="screen tab">
      <header class="top plain"><h2 data-t="createTitle"></h2></header>
      <div class="scroll pad">
        <div class="card stack">
          <textarea id="topic" rows="3" class="big-input" data-tp="topicPh"></textarea>
          <div class="seg-label" data-t="voiceLang"></div>
          <div class="seg" data-name="language"><button data-v="Telugu" class="on">Telugu</button><button data-v="English">English</button><button data-v="Hindi">Hindi</button></div>
          <div class="seg-label" data-t="voice"></div>
          <div class="seg" data-name="voice"><button data-v="female" class="on" data-t="female"></button><button data-v="male" data-t="male"></button></div>
          <div class="seg-label" data-t="length"></div>
          <div class="seg" data-name="length"><button data-v="30 seconds">30s</button><button data-v="1 minute" class="on">1 min</button><button data-v="2 minutes">2 min</button></div>
          <button class="btn primary" id="createBtn" data-t="createBtn"></button>
          <p class="muted small center" data-t="createNote"></p>
        </div>
        <div class="card" id="jobCard" hidden>
          <div class="job-row"><span class="pulse" id="jobDot"></span><div><b id="jobTitle"></b><div class="muted small" id="jobSub"></div></div></div>
        </div>
      </div>
    </section>

    <!-- CONNECT -->
    <section id="tab-connect" class="screen tab">
      <header class="top plain"><h2 data-t="connectTitle"></h2></header>
      <div class="scroll pad"><div id="provList" class="list"></div><p class="muted small center" data-t="connectNote"></p></div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="screen tab">
      <header class="top plain"><h2 data-t="settingsTitle"></h2></header>
      <div class="scroll pad">
        <div class="list">
          <div class="row"><span data-t="language"></span>
            <div class="seg small" id="setLang"><button data-v="te">Telugu</button><button data-v="en">English</button></div></div>
          <div class="row"><span><span data-t="voiceReplies"></span><br><span class="muted small" data-t="voiceRepliesSub"></span></span>
            <label class="switch"><input type="checkbox" id="setVoice"><span></span></label></div>
          <div class="row"><span data-t="theme"></span>
            <div class="seg small" id="setTheme"><button data-v="auto" data-t="auto"></button><button data-v="light" data-t="light"></button><button data-v="dark" data-t="dark"></button></div></div>
          <button class="row link" id="goConnect"><span data-t="connected"></span><span class="muted"><span id="connCount"></span> ›</span></button>
          <button class="row link" id="installRow" hidden><span data-t="install"></span><span class="muted">›</span></button>
          <button class="row link danger" id="logout"><span data-t="logout"></span></button>
        </div>
        <p class="muted small center" id="me"></p>
      </div>
    </section>

    <nav class="tabbar">
      <button data-tab="chat" class="on"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span data-t="tChat"></span></button>
      <button data-tab="create"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg><span data-t="tCreate"></span></button>
      <button data-tab="connect"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-t="tConnect"></span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span data-t="tSettings"></span></button>
    </nav>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div id="sheet" class="sheet-bg" hidden><div class="sheet"><p id="sheetText"></p><button class="btn primary" id="sheetOk">OK</button></div></div>
</div>
<script src="/app.js"></script>
</body>
</html>
