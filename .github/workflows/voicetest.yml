name: voicetest
on: workflow_dispatch
jobs:
  vt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -3
          pip install chatterbox-tts 2>&1 | tail -5
      - name: Generate
        env: { PYTHONUNBUFFERED: "1" }
        run: python voicetest.py
      - uses: actions/upload-artifact@v4
        with: { name: voices, path: out/ }
