name: stateproof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Read live state through /internal/state
        env:
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
        run: |
          python3 - <<'PY'
