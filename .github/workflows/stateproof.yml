name: stateproof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Read live state through /internal/state
        env:
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          URL = "https://divya.n8n00101.workers.dev/internal/state"
          KEY = os.environ["RUNNER_KEY"]
          def call(body):
              req = urllib.request.Request(URL, method="POST", data=json.dumps(body).encode(),
                                           headers={"content-type": "application/json", "x-runner-key": KEY,
                                                    "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, "body:", e.read()[:200])
                  raise
          # Guard cross-check: an older guarded route with the same key.
          req = urllib.request.Request("https://divya.n8n00101.workers.dev/internal/scout", method="POST",
                                       data=b"{}", headers={"content-type": "application/json", "x-runner-key": KEY,
                                                            "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"})
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print("SCOUT cross-check status 200, body:", r.read()[:200])
          except urllib.error.HTTPError as e:
              print("SCOUT cross-check HTTP", e.code, "body:", e.read()[:200])
          # C-13: did the consent record survive in the DO?
          g = call({"op": "get", "key": "setupconsent:917993610173"})
          print("C13 setupconsent:917993610173 ->", json.dumps(g)[:300])
          if g.get("exists"):
              print("C13 del ->", json.dumps(call({"op": "del", "key": "setupconsent:917993610173"})))
              print("C13 re-get ->", json.dumps(call({"op": "get", "key": "setupconsent:917993610173"})))
          # Key-family census (names/counts only; secret families are
          # never value-read by this script).
          prefixes = ["acct:", "ph:", "link:", "em:", "ukey:", "tok:", "gaccts:",
                      "setupchain:", "setupdone:", "setupjob:", "setuphist:", "scout:",
                      "hist:", "sess:", "oauth:", "wasetupask:", "setupalways:",
                      "setupstop:", "verify:", "job:", "agentjob:", "dbg:", "otp:"]
          for p in prefixes:
              r = call({"op": "list", "prefix": p, "limit": 1000})
              ks = r.get("keys", [])
              print(f"CENSUS {p} count={len(ks)}")
              if p in ("ph:", "link:", "em:", "setupchain:", "setupdone:", "wasetupask:", "setupalways:", "setupstop:", "scout:", "ukey:", "gaccts:") and ks:
                  print(f"CENSUS {p} names={json.dumps(ks[:60])}")
          # Ajju identity + retry-arm records (non-secret families).
          for k in ["setupdone:919951950173", "setupdone:917993610173", "scout:last"]:
              print("GET", k, "->", json.dumps(call({"op": "get", "key": k}))[:400])
          # Wave 2 identity facts: email index entries for Ajju's
          # mailboxes, the acct records behind them, tok: key NAMES
          # (list never returns values), and gaccts indexes.
          for e in ["markk34200@gmail.com", "mike0123l098@gmail.com", "n8n00101@gmail.com",
                    "aaha04671@gmail.com", "aoz709215@gmail.com", "n8n000221@gmail.com"]:
              print("EM", e, "->", json.dumps(call({"op": "get", "key": "em:" + e}))[:200])
          print("TOKNAMES", json.dumps(call({"op": "list", "prefix": "tok:", "limit": 100}).get("keys", [])))
          print("ACCTNAMES", json.dumps(call({"op": "list", "prefix": "acct:", "limit": 100}).get("keys", [])[:1500]))
          for u in ["u_1ae98fe781f28d88292377bc", "u_c3a7d44f625995a315d79632",
                    "u_83e04b25a999b9114429b6c5", "u_157dcd2a08241c33c2fd311a"]:
              print("GACCTS", u, "->", json.dumps(call({"op": "get", "key": "gaccts:" + u}))[:500])
          print("GACCTS 917993610173 ->", json.dumps(call({"op": "get", "key": "gaccts:917993610173"}))[:500])
          # Wave 2 backfill: Ajju's identity set (evidence: em: index —
          # markk34200 -> 1ae98fe…, mike0123l098 -> 157dcd2…; gaccts —
          # n8n00101@gmail.com grant id a130megv under BOTH c3a7d44… and
          # 83e04b2…; ukey openrouter under 919951950173; gaccts under
          # 917993610173). u_f9aa32… deliberately excluded: no
          # non-secret record attributes it to anyone.
          SET = ["917993610173", "919951950173",
                 "u_1ae98fe781f28d88292377bc", "1ae98fe781f28d88292377bc",
                 "u_157dcd2a08241c33c2fd311a", "157dcd2a08241c33c2fd311a",
                 "u_c3a7d44f625995a315d79632", "c3a7d44f625995a315d79632",
                 "u_83e04b25a999b9114429b6c5", "83e04b25a999b9114429b6c5"]
          for mid in SET:
              print("BACKFILL put link:" + mid, "->", json.dumps(call({"op": "put", "key": "link:" + mid, "value": SET})))
          print("BACKFILL read link:917993610173 ->", json.dumps(call({"op": "get", "key": "link:917993610173"}))[:400])
          print("BACKFILL list link: ->", json.dumps(call({"op": "list", "prefix": "link:", "limit": 100})))
          print("POOL scout:models ->", json.dumps(call({"op": "get", "key": "scout:models"}))[:600])
          # Wave 4 live proof: a dead-runner test chain (single
          # provider, signin pause 20 min old — past the skip budget).
          # The */15 cron's supervisor sweep must settle it with NO
          # user poll: job stopped, chain finalized, setupdone
          # written. Seed only if absent (idempotent across runs).
          import time as _t
          if not call({"op": "get", "key": "setupchain:w4testlive"}).get("exists"):
              now = int(_t.time() * 1000)
              print("W4 seed chain ->", json.dumps(call({"op": "put", "key": "setupchain:w4testlive", "value": {"providers": ["groq"], "done": [], "failed": [], "current": "w4job1", "email": "w4test@example.invalid", "at": now - 3600000, "browser": "profile"}})))
              print("W4 seed job ->", json.dumps(call({"op": "put", "key": "setupjob:w4job1", "value": {"job": "w4job1", "provider": "groq", "user": "w4testlive", "state": "paused", "pauseReason": "signin", "pausedAt": now - 20 * 60000, "upd": now - 20 * 60000, "at": now - 3600000}})))
          print("W4 chain ->", json.dumps(call({"op": "get", "key": "setupchain:w4testlive"}))[:300])
          print("W4 job ->", json.dumps(call({"op": "get", "key": "setupjob:w4job1"}))[:400])
          print("W4 done ->", json.dumps(call({"op": "get", "key": "setupdone:w4testlive"}))[:400])
          # Wave 4 cleanup: the proof is recorded (run 45341147081 —
          # watchdog settle "stalled" in the DO); remove the synthetic
          # records so no test chain lingers in production state.
          for k in ("setupchain:w4testlive", "setupjob:w4job1", "setupdone:w4testlive", "setuphist:w4testlive"):
              print("W4 cleanup del", k, "->", json.dumps(call({"op": "del", "key": k})))
          # Wave 6: the agent engine's first real job — seed the job
          # record (the same shape startAgentJob writes; the token-
          # gated app route is the normal door, this proof drives the
          # record + the same workflow_dispatch the Worker sends).
          W6JOB = "a6e00000000000000001"
          if not call({"op": "get", "key": "setupjob:" + W6JOB}).get("exists"):
              now = int(_t.time() * 1000)
              rec = {"job": W6JOB, "user": "w6testlive", "provider": "agent", "flow": "agent",
                     "task": "Read orders.csv in your workspace. Compute the total spend per customer (qty x price, summed per customer) and write the result to totals.csv with header customer,total and one row per customer. Then verify totals.csv exists with the rows you wrote.",
                     "state": "queued", "step": "starting", "note": "", "at": now, "upd": now,
                     "files": {"orders.csv": "customer,item,qty,price\nAnanya,Notebook,2,150\nRavi,Pen,5,40\nAnanya,Bag,1,900\nRavi,Notebook,1,150\nMeena,Pen,10,40\n"},
                     "evidence": [{"tool": "file_write", "contains": "totals.csv"}]}
              print("W6 seed job ->", json.dumps(call({"op": "put", "key": "setupjob:" + W6JOB, "value": rec})))
              print("W6 seed cur ->", json.dumps(call({"op": "put", "key": "agentcur:w6testlive", "value": {"job": W6JOB, "at": now}})))
          print("W6 job ->", json.dumps(call({"op": "get", "key": "setupjob:" + W6JOB}))[:1200])
          PY
