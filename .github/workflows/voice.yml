name: julie-voice
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Voice job id (KV vjob:<job>)"
        required: true
        type: string
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the locked voice engine
        uses: actions/checkout@v4
        with:
          repository: n8n00101-coder/julie-ai-voice-engine
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
          pip install -q httpx -r engine/requirements.txt 2>&1 | tail -3
      - name: Synthesize + return audio
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          JOB: ${{ inputs.job }}
          PYTHONUNBUFFERED: "1"
        run: python voice_job.py
