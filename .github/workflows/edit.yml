name: edit
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Divya job id"
        required: true
concurrency:
  group: edit-${{ inputs.job }}
jobs:
  edit:
    runs-on: ubuntu-latest
    # v74: was 60 — the long pipeline's internal budget alone is 50 min,
    # plus runner setup and result upload, so the Actions ceiling could
    # SIGKILL a nearly-finished job during assembly/upload with no
    # report reaching the Worker. 350 (GitHub max 360) removes the
    # hard-kill class; the internal budget still governs partial delivery.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core > /dev/null
          pip install -q httpx==0.27.2 numpy pillow edge-tts yt-dlp
      - name: Edit
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          DIVYA_ENGINE: ${{ vars.DIVYA_ENGINE || 'v2' }}
          PYTHONUNBUFFERED: "1"
        run: python runner.py "${{ inputs.job }}"
