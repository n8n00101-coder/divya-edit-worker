name: edit
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Divya job id"
        required: true
concurrency:
  group: edit-${{ inputs.job }}
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core > /dev/null
          pip install -q httpx==0.27.2 numpy pillow edge-tts
      - name: Edit
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          DIVYA_ENGINE: ${{ vars.DIVYA_ENGINE || 'v2' }}
          PYTHONUNBUFFERED: "1"
        run: python runner.py "${{ inputs.job }}"
