name: teltest
on: workflow_dispatch
jobs:
  te:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
          pip install git+https://github.com/ai4bharat/IndicF5.git 2>&1 | tail -2
          pip install "transformers==4.49.0" "numpy<2" soundfile "datasets<3.2" "huggingface_hub<0.30" "pyarrow<18" 2>&1 | tail -2
      - name: Generate
        env: { PYTHONUNBUFFERED: "1" }
        run: python teltest.py
      - uses: actions/upload-artifact@v4
        with: { name: te, path: out/ }
