<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #ffffff;
        --accent: #ffb340;
        --font-display: Oswald, sans-serif;
        --font-body: Inter, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene1"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1_title.html"
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene2"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2_data.html"
        data-start="15"
        data-duration="15"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene3"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3_map.html"
        data-start="30"
        data-duration="15"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="45"
        data-track-index="1"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
